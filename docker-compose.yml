version: '3.8'

services:
  muse2api:
    build: .
    image: muse2api:latest
    container_name: muse2api
    restart: always
    ports:
      - "18610:18610"
    environment:
      # 管理与 API 鉴权 Key（从 .env 或宿主环境读取，留空则自动生成）
      - MUSE2API_KEY=${MUSE2API_KEY:-}
      # 服务对外基准 URL，如 https://your-domain.com（留空则管理前端自动检测当前域名）
      - MUSE2API_PUBLIC_BASE=${MUSE2API_PUBLIC_BASE:-}
      # 并发上限，与平台 provider 的并发上限一致
      - MUSE2API_CONCURRENCY=${MUSE2API_CONCURRENCY:-3}
      # 镜像部署：禁止在容器里在线升级 / 推送代码，更新检测对照 fork 的部署分支
      - MUSE2API_MANAGED_DEPLOYMENT=1
      - MUSE2API_REPOSITORY=${MUSE2API_REPOSITORY:-ZhuoRC/muse2api}
      - MUSE2API_REPO_REF=${MUSE2API_REPO_REF:-deploy}
      # 超时配置（秒）
      - MUSE2API_IMAGE_TIMEOUT=240
      - MUSE2API_VIDEO_TIMEOUT=600
      - MUSE2API_CHAT_TIMEOUT=300
    volumes:
      # 持久化账号配置、任务日志及媒体文件
      - ./data:/app/data
    shm_size: '2gb' # 保证 Chromium 渲染多标签页时不因 /dev/shm 耗尽崩溃
